<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Delicate Courier — Portal (preview)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
:root{--ink:#0A0A0A;--pink:#E84A8A;--pink-soft:#F7A8CE;--purple:#7C5CFF;--yellow:#F4C430;--surface:#F8F6F3;--line:#ECEAE6;--muted:#86817A;--green:#2BB673;--blue:#5B9BFF;--sans:'Be Vietnam Pro',ui-sans-serif,system-ui,sans-serif;--display:'Manrope',ui-sans-serif,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0}
.mono{font-family:var(--mono);font-feature-settings:'tnum' 1}
button{font-family:var(--sans);cursor:pointer;border:none;background:none}
input,select{font-family:var(--sans);font-size:14px}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.3px}.brand .dot{color:var(--pink)}
.acct{color:var(--muted);font-size:13px}.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px}
.pill .lab{color:var(--muted);font-weight:500}.pill.prepaid{background:#EAFBF1;color:#127a45}.pill.loyalty{background:#F3EEFF;color:#5b40d6}
.tabs{display:flex;gap:4px;padding:14px 22px 0}
.tab{padding:9px 16px;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted)}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 -1px 0 var(--line),-1px 0 0 var(--line),1px 0 0 var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ico{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.ico.y{background:#FDF3D0}.ico.b{background:#E4EEFF}.ico.g{background:#E1F7EC}.ico.p{background:#FCE6F1}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 5px}label .opt{color:var(--muted);font-weight:500}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--pink)}
.steps{display:flex;align-items:center;margin:6px 0 20px}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);z-index:2}
.step.on .n{background:var(--pink);color:#fff}.step.done .n{background:var(--green);color:#fff}
.step .t{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--muted)}.step.on .t,.step.done .t{color:var(--ink)}
.step:not(:last-child):after{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line)}
.step.done:not(:last-child):after{background:var(--green)}
.btn{padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px}
.btn.primary{background:var(--pink);color:#fff}.btn.primary:disabled{background:var(--pink-soft);cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btnrow{display:flex;justify-content:space-between;margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{background:var(--pink-soft);color:var(--ink);font-size:11px;letter-spacing:.4px;text-transform:uppercase;text-align:left;padding:9px 10px}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
.linkish{color:var(--pink);font-weight:700;background:none}
.rate{display:flex;justify-content:space-between;align-items:flex-end;background:#FBF7FA;border:1px solid #F3E2EC;border-radius:14px;padding:16px 18px;margin-top:8px}
.rate .big{font-family:var(--display);font-weight:800;font-size:30px}.rate .lines{color:var(--muted);font-size:12.5px;text-align:right}.rate .lines b{color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.slot{border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left}
.slot.sel{border-color:var(--pink);background:#FCEFF5}.slot.full{opacity:.5;cursor:not-allowed}
.slot .d{font-weight:700;font-size:12.5px}.slot .w{color:var(--muted);font-size:11.5px}
.slot .r{margin-top:5px;font-size:11.5px;font-weight:600}.slot .r.low{color:#c1121f}.slot .r.ok{color:var(--green)}
.toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;margin-top:8px}
.tg{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.tg b{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--pink)}.tg.on b{left:18px}
.err{color:#c1121f;font-size:12px;margin-top:5px;font-weight:600}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.filters .f{display:flex;flex-direction:column}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:600;font-size:12px}
.chip.created{background:#EDEBE7;color:#555}.chip.collected{background:#E4EEFF;color:#2b62c9}.chip.in_transit{background:#EAE3FF;color:#5b40d6}
.chip.out_for_delivery{background:#FFF1DC;color:#b06a00}.chip.delivered{background:#E1F7EC;color:#127a45}
.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-weight:700;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase}
.badge.portal{background:#FCE6F1;color:#b3246c}.badge.woocommerce{background:#EAE3FF;color:#5b40d6}.badge.api{background:#E4EEFF;color:#2b62c9}.badge.shopify{background:#E1F7EC;color:#127a45}
tr.rowlink:hover{background:#FBF7FA;cursor:pointer}
.timeline{display:flex;align-items:center;margin:4px 0 18px}
.tl{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.tl .c{width:14px;height:14px;border-radius:50%;background:var(--line);z-index:2}
.tl.done .c{background:var(--green)}.tl.now .c{background:var(--pink);box-shadow:0 0 0 4px #FCEFF5}
.tl .l{font-size:10.5px;font-weight:700;margin-top:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}.tl.done .l,.tl.now .l{color:var(--ink)}
.tl:not(:last-child):after{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}.tl.done:not(:last-child):after{background:var(--green)}
.kv{display:flex;gap:8px;margin:7px 0;font-size:13px}.kv b{min-width:130px;color:var(--muted);font-weight:600}
.banner{background:#E1F7EC;border:1px solid #b9ead0;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:#E4EEFF;color:#2b62c9;font-weight:600;font-size:12px}.tag.perish{background:#FCE6F1;color:#b3246c}
.map{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#eef4ff,#f7f0f6)}
.driver{position:absolute;width:34px;height:34px;margin:-17px;offset-path:path('M 40 150 C 140 110, 200 60, 320 70 S 480 130, 560 60');offset-distance:0;animation:drive 9s ease-in-out infinite alternate;z-index:3}
.driver .dd{width:34px;height:34px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 12px rgba(232,74,138,.5)}
@keyframes drive{to{offset-distance:100%}}
.etaband{position:absolute;left:14px;bottom:12px;background:#fff;border-radius:11px;padding:9px 13px;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:12.5px;font-weight:600;z-index:4}
.evrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.evrow .dot2{width:10px;height:10px;border-radius:50%;background:var(--pink);margin-top:5px;flex:none}
.daygrid{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.day{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.day.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.capcell{border:1px solid var(--line);border-radius:13px;padding:12px}
.capcell.closed{background:#FBF1F1;border-color:#f1d5d5}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar b{display:block;height:100%;background:var(--green)}.bar b.hot{background:var(--yellow)}.bar b.full{background:var(--pink)}
.preview-note{max-width:1100px;margin:0 auto;padding:0 22px 26px;color:var(--muted);font-size:12px}
</style></head>
<body>
<div class="topbar">
  <div class="brand">Delicate<span class="dot">.</span>Courier</div>
  <div class="acct" id="acctLabel">Baked By Nataleen · BBN001</div>
  <div class="spacer"></div>
  <div class="seg" id="roleSeg"><button class="on" onclick="setRole('client')">Client portal</button><button onclick="setRole('admin')">Super admin</button></div>
  <div id="balances" class="seg" style="border:none;background:none;padding:0;gap:8px;cursor:pointer" onclick="if(S.role==='client'){setTab('wallet')}"><div class="pill prepaid"><span class="lab">Prepaid</span> <span id="walletPill" class="mono">R2,888.31</span></div><div class="pill loyalty"><span class="lab">Cash-back</span> <span id="loyaltyPill" class="mono">R184.20</span></div></div>
</div>
<div class="tabs" id="tabbar"></div>
<div class="wrap" id="app"></div>
<div class="preview-note" id="note"></div>
<script>
const PACKAGE_TYPES=[{id:5,name:'Platters Medium',l:30,w:30,h:10,kg:3},{id:6,name:'Platters Large',l:45,w:45,h:12,kg:6},{id:7,name:'Cake Box',l:35,w:35,h:25,kg:4},{id:3,name:'Box Medium',l:40,w:30,h:30,kg:5},{id:1,name:'Satchel',l:30,w:22,h:5,kg:1}];
const CATEGORIES=[{id:1,name:'Freshly Prepared Platters'},{id:3,name:'Cakes'},{id:5,name:'General'}];
const ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';const ref=n=>Array.from({length:n},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
const rands=c=>'R'+(c/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const STAGE_LABEL={created:'Created',collected:'Collected',in_transit:'In transit',out_for_delivery:'Out for delivery',delivered:'Delivered'};
const STAGES=['created','collected','in_transit','out_for_delivery','delivered'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function genSlots(policy){const out=[];let d=new Date();let made=0;while(out.length<policy.windows.length*8){d=new Date(d.getTime()+864e5);if(policy.days[(d.getDay()+6)%7]){policy.windows.forEach((w,wi)=>{let booked=made===0&&wi===1?13:Math.floor((made*4+wi*3)%(w.cap));out.push({date:d.toISOString().slice(0,10),window:w.key,label:w.label,cap:w.cap,booked:Math.min(booked,w.cap),status:'open'});});made++;}}out.forEach(s=>{if(s.booked>=s.cap)s.status='closed_full';});return out;}
const S={role:'client',tab:'book',step:1,walletCents:288831,
 q:{collect:'135 Erich Mayer Street, Pretoria North',deliver:'Unit 102i The Precinct, Midrand',parcels:[{pkg:5,cat:1,l:30,w:30,h:10,kg:3}]},rate:null,
 f:{cName:'',cPhone:'',dName:'',dPhone:'',slot:null,liability:false,declared:'',custRef:''},errors:{},lastBooking:null,
 shipments:[
  {wb:'KSN2A9',origin:'portal',svc:'STD',stage:'out_for_delivery',from:'135 Erich Mayer Street, Pretoria North',to:'26 Avondale Crescent, Midstream',cust:'L. Pretorius',rate:31383,pkg:'Platters Medium',cat:'Freshly Prepared Platters',driver:{name:'Vinny',eta:'10:42',km:'3.1'},events:[{s:'Out for delivery',loc:'Midrand',t:'10:18'},{s:'Collected',loc:'Pretoria North',t:'08:50'},{s:'Collection assigned',loc:'Pretoria North',t:'08:05'},{s:'Created',loc:'—',t:'07:40'}]},
  {wb:'WC123',origin:'woocommerce',store:'bakedbynataleen.co.za',svc:'STD',stage:'created',from:'135 Erich Mayer Street, Pretoria North',to:'12 Main Rd, Centurion',cust:'A. Customer',rate:24810,pkg:'Cake Box',cat:'Cakes',events:[{s:'Collection assigned',loc:'Pretoria North',t:'09:30'},{s:'Created (website order)',loc:'—',t:'09:12'}]},
  {wb:'7LL47Q',origin:'portal',svc:'STD',stage:'collected',from:'135 Erich Mayer Street, Pretoria North',to:'Hill Of Good Hope 2, Springfield Rd',cust:'M. Dlamini',rate:28790,pkg:'Box Medium',cat:'General',events:[{s:'Collected',loc:'Pretoria North',t:'09:05'},{s:'Created',loc:'—',t:'08:20'}]},
  {wb:'SH8842',origin:'shopify',store:'thecakestudio.myshopify.com',svc:'STD',stage:'delivered',from:'9 Bakery Lane, Lynnwood',to:'862 15th Avenue, Wonderboom',cust:'P. Naidoo',rate:21500,pkg:'Satchel',cat:'General',events:[{s:'Delivered',loc:'Wonderboom',t:'Yesterday 15:22'},{s:'Out for delivery',loc:'Pretoria',t:'13:40'},{s:'Created (website order)',loc:'—',t:'Yesterday 09:00'}]}],
 fStage:'',detail:null,policy:{days:[1,1,1,1,1,0,0],leadMin:120,windows:[{key:'am',label:'Morning 08:00–12:00',cap:20},{key:'pm',label:'Afternoon 12:00–16:00',cap:15}]},slots:[],blackouts:[],
 distance:15,activeCardId:2,
 rateCards:[{id:1,name:'Default',client:null,isDefault:true,costPerKm:1.98,marginPct:55,fuelPct:10,minFee:60},
            {id:2,name:'Baked By Nataleen',client:'Baked By Nataleen',isDefault:false,costPerKm:1.98,marginPct:55,fuelPct:10,minFee:60}],
 loyalty:{tier:'Silver',rate:3,cashbackCents:18420,monthlyShipments:14,nextTier:'Gold',nextAt:20},
 ledger:[{kind:'cashback',label:'Cash-back · KSN2A9 delivered',amt:941,when:'Today 10:55'},
         {kind:'charge',label:'Booking charge · KSN2A9',amt:-31383,when:'Today 07:40'},
         {kind:'topup',label:'Top-up · BobPay',amt:200000,when:'Yesterday 16:20'},
         {kind:'charge',label:'Booking charge · 7LL47Q',amt:-28790,when:'Yesterday 08:20'}],
 topup:{amount:'',link:null}};
function priceFromCard(distanceKm,card){let m=card.marginPct/100;if(m>=1)m=0.99;const cogs=distanceKm*card.costPerKm;let base=cogs/(1-m);let fuel=base*(card.fuelPct/100);let total=base+fuel;if(card.minFee&&total<card.minFee)total=card.minFee;const totalC=Math.round(total*100);const baseC=Math.round(totalC/(1+card.fuelPct/100));return {total:totalC,base:baseC,fuel:totalC-baseC,charged:0};}
function activeCard(){return S.rateCards.find(c=>c.id===S.activeCardId)||S.rateCards[0];}
S.slots=genSlots(S.policy);
const app=()=>document.getElementById('app');
function setRole(r){S.role=r;S.tab=r==='client'?'book':'capacity';S.detail=null;document.querySelectorAll('#roleSeg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(r==='client')));document.getElementById('balances').style.display=r==='client'?'':'none';document.getElementById('acctLabel').textContent=r==='client'?'Baked By Nataleen · BBN001':'Super Admin · Delicate Courier';renderTabs();render();}
function renderTabs(){const tabs=S.role==='client'?[['book','New booking'],['ships','Shipments'],['wallet','Wallet']]:[['capacity','Capacity'],['allships','All shipments'],['rates','Rate cards'],['treasury','Treasury']];document.getElementById('tabbar').innerHTML=tabs.map(([k,l])=>`<div class="tab ${S.tab===k?'active':''}" onclick="setTab('${k}')">${l}</div>`).join('');}
function setTab(t){S.tab=t;S.detail=null;renderTabs();render();}
function render(){document.getElementById('note').textContent='Preview prototype · real brand tokens, API shapes, pricing and allocation logic · in-memory mock data.';if(S.role==='admin'){if(S.tab==='capacity')return renderCapacity();if(S.tab==='rates')return renderRates();if(S.tab==='treasury')return renderTreasury();return renderAllShips();}if(S.tab==='book')return renderBook();if(S.tab==='wallet')return renderWallet();return S.detail!==null?renderDetail(S.shipments[S.detail]):renderShips();}
function stepper(){const L=['Quote','Finalise','Done'];return `<div class="steps">${L.map((l,i)=>{const n=i+1,c=n<S.step?'done':(n===S.step?'on':'');return `<div class="step ${c}"><div class="n">${n<S.step?'✓':n}</div><div class="t">${l}</div></div>`}).join('')}</div>`;}
const pkgOpt=s=>PACKAGE_TYPES.map(p=>`<option value="${p.id}" ${p.id==s?'selected':''}>${p.name}</option>`).join('');
const catOpt=s=>CATEGORIES.map(c=>`<option value="${c.id}" ${c.id==s?'selected':''}>${c.name}</option>`).join('');
function renderBook(){if(S.step===1)return renderQuote();if(S.step===2)return renderFinalise();return renderDone();}
function renderQuote(){const ps=S.q.parcels;app().innerHTML=`${stepper()}<div class="card"><h3><span class="ico b">📦</span> Where is it going?</h3><div class="sub">Address and parcels only. No recipient contact needed to see a price.</div><div class="grid2"><div><label>Collection address</label><input class="inp" id="collect" value="${S.q.collect}"></div><div><label>Delivery address</label><input class="inp" id="deliver" value="${S.q.deliver}"></div></div><div style="max-width:240px"><label>Estimated distance (km) <span class="opt">— geocoded live in production</span></label><input class="inp" type="number" value="${S.distance}" onchange="setDistance(this.value)"></div></div><div class="card"><h3><span class="ico g">🧾</span> Parcels</h3><div class="sub">Pick a package type and dimensions prefill. Charged weight is the greater of actual and volumetric.</div><table><thead><tr><th>#</th><th>Package type</th><th>Category</th><th>L</th><th>W</th><th>H</th><th>Weight</th><th></th></tr></thead><tbody>${ps.map((p,i)=>`<tr><td>${i+1}</td><td><select class="inp" onchange="setParcel(${i},'pkg',this.value,1)">${pkgOpt(p.pkg)}</select></td><td><select class="inp" onchange="setParcel(${i},'cat',this.value)">${catOpt(p.cat)}</select></td><td><input class="inp" style="width:60px" value="${p.l}" onchange="setParcel(${i},'l',this.value)"></td><td><input class="inp" style="width:60px" value="${p.w}" onchange="setParcel(${i},'w',this.value)"></td><td><input class="inp" style="width:60px" value="${p.h}" onchange="setParcel(${i},'h',this.value)"></td><td><input class="inp" style="width:70px" value="${p.kg}" onchange="setParcel(${i},'kg',this.value)"> kg</td><td>${ps.length>1?`<button class="linkish" onclick="rmP(${i})">remove</button>`:''}</td></tr>`).join('')}</tbody></table><button class="linkish" style="margin-top:10px" onclick="addP()">+ Add parcel</button></div>${S.rate?`<div class="card"><h3><span class="ico y">🚚</span> Your rate</h3><div class="rate"><div><div class="big mono">${rands(S.rate.total)}</div><div style="color:var(--muted);font-size:12px">incl. VAT · charged weight ${S.rate.charged} kg · ${S.rate.km} km on ${S.rate.card} card</div></div><div class="lines">Base rate <b class="mono">${rands(S.rate.base)}</b><br>Fuel levy <b class="mono">${rands(S.rate.fuel)}</b></div></div></div>`:''}<div class="btnrow"><span></span>${S.rate?`<button class="btn primary" onclick="goFin()">Book this shipment →</button>`:`<button class="btn primary" onclick="getRate()">Get rate</button>`}</div>`;}
function setParcel(i,k,v,pf){S.q.parcels[i][k]=(k==='pkg'||k==='cat')?+v:v;if(pf){const p=PACKAGE_TYPES.find(x=>x.id==v);if(p){Object.assign(S.q.parcels[i],{l:p.l,w:p.w,h:p.h,kg:p.kg});}}S.rate=null;renderBook();}
function addP(){S.q.parcels.push({pkg:5,cat:1,l:30,w:30,h:10,kg:3});S.rate=null;renderBook();}

function getRate(){S.q.collect=collect.value;S.q.deliver=deliver.value;const card=activeCard();const r=priceFromCard(S.distance,card);let a=0,v=0;S.q.parcels.forEach(p=>{a+=+p.kg||0;v+=((+p.l||0)*(+p.w||0)*(+p.h||0))/5000;});S.rate={total:r.total,base:r.base,fuel:r.fuel,charged:Math.max(a,v).toFixed(2),card:card.name,km:S.distance};renderBook();}
