<!DOCTYPE html>
<html>
<head>
    <title>Delicate Courier Login</title>
    <style>
        body { 
            background: #F8F6F3; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box { 
            width: 380px; 
            background: white; 
            padding: 40px 32px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        /* Logo styling */
        .logo {
            margin-bottom: 20px;
        }
        .logo svg {
            width: 64px;
            height: 64px;
            display: block;
            margin: 0 auto;
        }
        h2 {
            color: #0A0A0A;
            font-weight: 600;
            margin: 0 0 8px 0;
            font-size: 1.75rem;
        }
        .sub {
            color: #585f6c;
            font-size: 0.85rem;
            margin-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
            display: inline-block;
            padding-bottom: 6px;
        }
        input { 
            width: 100%; 
            padding: 12px 14px;
            margin: 10px 0;
            border: 1px solid #E5E7EB;
            border-radius: 40px;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }
        input:focus {
            border-color: #E84A8A;
            box-shadow: 0 0 0 3px rgba(232,74,138,0.2);
        }
        button { 
            background: #0A0A0A;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
        }
        button:hover {
            background: #E84A8A;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-note {
            margin-top: 28px;
            font-size: 0.7rem;
            color: #9e9e9e;
        }
    </style>
</head>
<body>
    <div class="login-box">
        {% load static %}
<div class="logo">
  <img src="{% static 'images/logo.png' %}" alt="Delicate Courier Logo" width="auto" height="130">
        </div>
        <h2>Delicate Courier</h2>
        <div class="sub">Admin Portal</div>
        <form method="post" action="">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <div class="footer-note">Internal use only</div>
    </div>
</body>
</html>
