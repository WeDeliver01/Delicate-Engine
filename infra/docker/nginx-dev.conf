# dev.delicatecourier.co.za — vhost for the nginx that already runs on this VPS.
#
# This box already serves other sites, including a live client one, so the engine does not take
# ports 80 and 443. It binds to loopback and nginx proxies to it; the worst a mistake in here can
# do is break this site, never someone else's.
#
# Install:
#   sudo cp infra/docker/nginx-dev.conf /etc/nginx/sites-available/dev.delicatecourier.co.za
#   sudo ln -s /etc/nginx/sites-available/dev.delicatecourier.co.za /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then the certificate. This box issues via webroot (matching its other sites), and the
# acme-challenge location below is what makes that work through a vhost that otherwise
# proxies everything:
#   sudo certbot certonly --webroot -w /var/www/html -d dev.delicatecourier.co.za
#
# `nginx -t` before every reload. It parses the whole configuration, so it will also catch a
# mistake that would have taken the other sites down with it.

server {
    listen 80;
    listen [::]:80;
    server_name dev.delicatecourier.co.za;

    # Uploaded proof-of-delivery photos arrive as data URLs inside JSON.
    client_max_body_size 4m;

    # It is a development site; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Let's Encrypt writes its challenge file into the webroot and expects to fetch it over
    # plain HTTP. Without this it would be proxied to the web app like everything else, which
    # answers 404 and fails the validation — at issue time and again at every renewal.
    # "^~" so it wins against the catch-all below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        access_log off;
    }

    # The engine. Straight through, so a webhook signature is computed over the bytes the
    # provider actually sent — anything that re-encodes the body breaks it.
    location /api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # The web app.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev tooling and any future streaming need these.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
