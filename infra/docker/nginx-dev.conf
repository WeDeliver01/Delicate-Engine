# dev.delicatecourier.co.za — vhost for the nginx that already runs on this VPS.
#
# This box already serves other sites, including live client ones, so the engine does not take
# ports 80 and 443 for itself. It binds to loopback and nginx proxies to it; the worst a mistake
# in here can do is break this site, never someone else's.
#
# Install:
#   sudo cp infra/docker/nginx-dev.conf /etc/nginx/sites-available/dev.delicatecourier.co.za
#   sudo ln -s /etc/nginx/sites-available/dev.delicatecourier.co.za /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is issued by webroot, matching this box's other sites, and the acme-challenge
# location below is what makes that work through a vhost that otherwise proxies everything:
#   sudo certbot certonly --webroot -w /var/www/html -d dev.delicatecourier.co.za
#
# `nginx -t` before every reload, without exception. It parses the whole configuration, so it
# also catches a mistake that would have taken the other sites down with it.

# ── HTTP: renewals, and a push to HTTPS for everything else ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.delicatecourier.co.za;

    # Let's Encrypt writes its challenge file into the webroot and fetches it over plain HTTP.
    # Without this it would be proxied to the web app like everything else, which answers 404.
    # This is needed at every renewal, not just the first issue. "^~" beats the catch-all.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    # nginx 1.24 on this box: http2 goes on the listen line. The separate `http2 on;` directive
    # only exists from 1.25.1, and using it here fails the config test.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.delicatecourier.co.za;

    ssl_certificate     /etc/letsencrypt/live/dev.delicatecourier.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.delicatecourier.co.za/privkey.pem;

    # Set inline rather than including certbot's options-ssl-nginx.conf, which is installed by
    # the nginx plugin — not present on this box, and a missing include fails the config test
    # for every site, not just this one.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_dev:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Proof-of-delivery photos arrive as data URLs inside JSON.
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A development site; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The engine. Straight through, so a webhook signature is computed over the bytes the
    # provider actually sent — anything that re-encodes the body breaks it.
    location /api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # The web app.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
