# The dev environment on the VPS: dev.delicatecourier.co.za
#
# TWO MODES, because this VPS is shared with other sites.
#
# Images come from CI (ghcr.io/wedeliver01/...), so this machine never compiles anything. That
# matters here: the box has 2 vCPU and runs live services, and a Next.js build would peg both
# cores for minutes. `deploy-dev.sh --build` still builds locally when you need it.
#
#   default          Nothing touches ports 80 or 443. The web app and the engine bind to
#                    127.0.0.1 only, and whatever web server already owns the edge on this box
#                    (nginx, in our case, serving a live client site) proxies to them. This is
#                    the safe mode for a shared machine: the worst a mistake can do is break
#                    this stack, never someone else's site.
#
#   --profile edge   Caddy takes 80 and 443 and gets its own certificate. Only for a machine
#                    where nothing else serves the web.
#
# Either way /api goes straight to the engine rather than through the web app, so webhooks reach
# it with their bytes untouched — a signature is computed over exactly what was sent, and a proxy
# that re-encodes the body breaks it.
#
# Differences from compose.prod.yml, on purpose:
#   - Postgres runs here in a container. Production uses Supabase; a dev environment does not
#     need to share a database with anything, and a container is one less thing to configure.
#   - Images are built on this machine from the checked-out source, because there is no registry
#     yet. Swap `build:` for `image:` once CI is pushing to one.
#
# Auth is still Supabase. The runtime image is a production build, which refuses development
# tokens — a public host with dev tokens would be a real hole, and testing the login your
# customers will use is most of the point of having a dev environment.
#
# Deploy: infra/scripts/deploy-dev.sh   ·   Runbook: docs/RUNBOOK.md
name: delicate-dev

services:
  # Opt-in only: `docker compose --profile edge up -d`. On a shared box, leave it off and let
  # the existing web server proxy to the ports below.
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DEV_HOST: ${DEV_HOST:?set DEV_HOST, e.g. dev.delicatecourier.co.za}
    depends_on: [api, web]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delicate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-delicate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: the only things that need it are on this network. Reach it for
    # a backup with `docker compose exec postgres pg_dump`.
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delicate} -d ${POSTGRES_DB:-delicate}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    image: ${IMAGE_API:-ghcr.io/wedeliver01/engine-api:${IMAGE_TAG:-latest}}
    # Only used by `--build`; normally the image above is pulled.
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 8080
      RUN_MIGRATIONS: "1"
    # Loopback only. The edge proxy on this host reaches it; nothing outside can.
    ports: ["127.0.0.1:${API_BIND_PORT:-8091}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  worker:
    # The same image as the engine, with a different command.
    image: ${IMAGE_API:-ghcr.io/wedeliver01/engine-api:${IMAGE_TAG:-latest}}
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "0"
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  web:
    image: ${IMAGE_WEB:-ghcr.io/wedeliver01/engine-web:${IMAGE_TAG:-latest}}
    # Only used by `--build`. Anything NEXT_PUBLIC_ is inlined into the browser bundle at build
    # time, so it is set here rather than at run time; "/api" keeps the browser on one origin.
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
    # Loopback only, same reasoning as the engine.
    ports: ["127.0.0.1:${WEB_BIND_PORT:-8090}:3000"]
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

volumes:
  caddy_data:
  caddy_config:
  pgdata:
